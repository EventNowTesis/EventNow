<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | EventNow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="public/css/login.css">
</head>
<body>

<main class="login-layout">
  <div class="login-left">
    <a href="index.php?slug=landing" class="brand-logo">
      <div class="brand-logo-icon">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
      </div>
      <span class="brand-logo-text">EventNow</span>
    </a>

    <h1 class="font-serif">Qué bueno verte de nuevo</h1>
    <p class="description">En la ciudad siguen pasando cosas. Entrá y no te pierdas ninguna.</p>

    <form action="index.php?slug=login" method="POST">

      <div class="form-group">
        <div class="label-header">
          <label for="txt_email">Correo electrónico</label>
        </div>
        <div class="input-wrapper">
          <svg class="input-icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
            <polyline points="22,6 12,13 2,6"></polyline>
          </svg>
          <input id="txt_email" name="txt_email" type="email" placeholder="hola@gmail.com" required>
        </div>
      </div>

      <div class="form-group">
        <div class="label-header">
          <label for="txt_password">Contraseña</label>

        </div>
        <div class="input-wrapper">
          <svg class="input-icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <input id="txt_password" name="txt_password" type="password" placeholder="•••" required>
          <button type="button" class="toggle-pass" onclick="togglePasswordVisibility()" aria-label="Mostrar u ocultar contraseña">
            <svg id="eye-icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>

      </div>
      <a href="#" class="forgot-link">¿La olvidaste?</a>
      <div id="msg__error">{msg_error}</div>

      <button name="btn_iniciar" class="btn-submit" type="submit">
        Iniciar sesión
      </button>

    </form>

    <div class="divider-box">
      ¿Todavía no tienes cuenta? <a href="index.php?slug=register" class="register-link">Creala aca</a>
    </div>

  </div>

  <aside class="login-right">
    <div class="bg-overlay"></div>
    <div class="right-content">
      <svg class="ticket-icon" fill="none" stroke="currentColor" stroke-width="1.2" viewBox="0 0 24 24">
        <path d="M15 5v2m0 4v2m0 4v2M5 5h14a2 2 0 0 1 2 2v3a2 2 0 0 0 0 4v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-3a2 2 0 0 0 0-4V7a2 2 0 0 1 2-2z"></path>
      </svg>
      <h2 class="font-serif">Tu próxima noche empieza con un clic.</h2>
      <p>Guarda eventos, confirma asistencia y recibe recordatorios de lo que pasa cerca tuyo.</p>
      <div class="icons-row">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
          <circle cx="12" cy="10" r="3"></circle>
        </svg>
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M9 18V5l12-2v13"></path>
          <circle cx="6" cy="18" r="3"></circle>
          <circle cx="18" cy="16" r="3"></circle>
        </svg>
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M15 5v2m0 4v2m0 4v2M5 5h14a2 2 0 0 1 2 2v3a2 2 0 0 0 0 4v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-3a2 2 0 0 0 0-4V7a2 2 0 0 1 2-2z"></path>
        </svg>
      </div>
    </div>
  </aside>

</main>

<script src="public/js/login.js"></script>

</body>
</html>

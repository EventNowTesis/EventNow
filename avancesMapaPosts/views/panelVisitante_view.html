<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Visitante</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
    --bg-warm: #FAF8F5;
    --card-bg: #FFFFFF;

    --text-main: #1A1A1A;
    --text-muted: #666666;

    --accent-brown: #A0522D;
    --accent-brown-hover: #8B4513;

    --highlight-bg: #E8DCCB;
    --border-color: #EAE6E1;
    --pill-bg: #F3EFEA;

    --font-title: 'Playfair Display', serif;
    --font-body: 'Plus Jakarta Sans', sans-serif;
}


/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    background-color: var(--bg-warm);
    color: var(--text-main);
    font-family: var(--font-body);
}

a {
    color: inherit;
    text-decoration: none;
}

button,
input,
select {
    font-family: inherit;
}
        .contenedor {
            max-width: 1000px;
            margin: 0 auto;
        }

        .cabecera {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            background: var(--bg-surface);
            padding: 1rem 1.5rem;
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
        }

        .cabecera h1 {
            font-size: 1.5rem;
            color: var(--accent-color);
        }

        .acciones {
            display: flex;
            gap: 0.8rem;
        }

        .acciones a {
            text-decoration: none;
            padding: 0.6rem 1.2rem;
            background: var(--primary-color);
            color: black;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .acciones a:hover {
            background: var(--primary-hover);
        }

        .acciones a.btn-logout {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger-color);
            border: 1px solid var(--danger-color);
        }

        .acciones a.btn-logout:hover {
            background: var(--danger-color);
            color: black;
        }

        .profile-card {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            background: var(--bg-surface);
            padding: 2rem;
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
        }

        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: rgb(155, 155, 155);;
            border: 3px solid var(--accent-color);
        }

        .profile-info h2 {
            font-size: 1.6rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .profile-info .email {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-top: 0.3rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .role-badge {
            font-size: 0.75rem;
            background: var(--bg-surface-hover);
            padding: 3px 10px;
            border-radius: 12px;
            color: var(--accent-color);
            border: 1px solid var(--border-color);
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="contenedor">

        <div class="cabecera">
            <h1><i class="fa-solid fa-calendar-star"></i> Perfil Visitante</h1>
            <div class="acciones">
                <a href="index.php?slug=landing"><i class="fa-solid fa-eye"></i> Ver eventos</a>
                <a href="index.php?slug=logout" class="btn-logout" onclick="return confirm('¿Seguro que querés cerrar sesión?');">
                    <i class="fa-solid fa-right-from-bracket"></i> Cerrar sesión
                </a>
            </div>
        </div>

        <div class="profile-card">
            <div class="profile-avatar">
                <i class="fa-solid fa-user"></i>
            </div>
            <div class="profile-info">
                <h2>{USUARIO_NOMBRE} <span class="role-badge">{USUARIO_ROL}</span></h2>
                <p class="email"><i class="fa-regular fa-envelope"></i> {USUARIO_EMAIL}</p>
            </div>
        </div>

    </div>

</body>
</html>
